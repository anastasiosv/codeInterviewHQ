services:
  # Web Service (FastAPI + React)
  - type: web
    name: codeinterviewhq
    env: docker
    plan: free
    branch: main
    repo: https://github.com/anastasiosv/codeInterviewHQ # Update this if needed, or Render will auto-detect
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: codeinterviewhq-db
          property: connectionString
      - key: PORT
        value: 8000

databases:
  # Managed PostgreSQL
  - name: codeinterviewhq-db
    databaseName: codeinterviewhq
    user: codeinterviewhq_user
    plan: free
    ipAllowList: [] # Allow all IPs for now, or restrict as needed
